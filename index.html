<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reversi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ipad-frame">
    <div id="app">

      <!-- Left player panel — inner rotated -90° so it reads correctly from the left short side -->
      <div id="panel-left" class="player-panel">
        <div class="panel-inner">
          <div class="panel-scores">
            <div class="score-item" id="left-score-black">
              <div class="piece black"></div>
              <span class="score-num" id="left-black-count">2</span>
            </div>
            <div class="score-item" id="left-score-white">
              <div class="piece white"></div>
              <span class="score-num" id="left-white-count">2</span>
            </div>
          </div>
          <div class="piece-slot" id="left-slot"></div>
          <!-- Decorative character icons (CSS shows the correct one) -->
          <svg class="panel-icon wand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" aria-hidden="true">
            <rect x="20" y="24" width="155" height="12" rx="5" fill="#E91E8C"/>
            <rect x="28" y="25.5" width="140" height="4" rx="2" fill="rgba(255,255,255,0.38)"/>
            <rect x="28" y="33" width="140" height="2.5" rx="1" fill="rgba(0,0,0,0.18)"/>
            <polygon fill="#E91E8C" points="23,8 24.42,24.69 34,10.95 26.89,26.11 42.05,19 28.31,28.58 45,30 28.31,31.42 42.05,41 26.89,33.89 34,49.05 24.42,35.31 23,52 21.58,35.31 12,49.05 19.11,33.89 3.95,41 17.69,31.42 1,30 17.69,28.58 3.95,19 19.11,26.11 12,10.95 21.58,24.69"/>
            <polygon fill="#880E4F" points="23,22 31,30 23,38 15,30"/>
            <polygon fill="rgba(255,255,255,0.6)" points="15,25 23,22 30,26 23,29"/>
          </svg>
          <svg class="panel-icon broomstick-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" aria-hidden="true">
            <polygon fill="#43A047" stroke="#1B5E20" stroke-width="0.8" stroke-linejoin="round"
              points="82,24 72,18 62,10 55,16 45,6 38,14 28,8 22,16 14,10 8,18 3,28 3,32 8,42 14,50 22,44 28,52 38,46 45,54 55,44 62,50 72,42 82,36"/>
            <g stroke="#1B5E20" stroke-width="1" opacity="0.55" stroke-linecap="round">
              <line x1="82" y1="27" x2="6"  y2="22"/><line x1="82" y1="30" x2="3" y2="30"/>
              <line x1="82" y1="33" x2="6"  y2="38"/><line x1="82" y1="26" x2="30" y2="9"/>
              <line x1="82" y1="34" x2="30" y2="51"/><line x1="82" y1="28" x2="52" y2="8"/>
              <line x1="82" y1="32" x2="52" y2="52"/>
            </g>
            <rect x="80" y="24" width="95" height="12" rx="5" fill="#388E3C"/>
            <rect x="88" y="25.5" width="82" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
            <rect x="88" y="33" width="82" height="2.5" rx="1" fill="rgba(0,0,0,0.18)"/>
          </svg>
          <div class="panel-end">
            <span class="panel-status" id="left-status">Black's turn</span>
          </div>
        </div>
      </div>

      <!-- Name strips (set at game start from username selection) -->
      <div id="name-strip-left"  class="player-name-strip"><span></span></div>

      <!-- Board -->
      <div id="board-wrap">
        <div id="board-inner">
          <div id="board"></div>
        </div>
      </div>

      <div id="name-strip-right" class="player-name-strip"><span></span></div>

      <!-- Right player panel — inner rotated +90° so it reads correctly from the right short side -->
      <div id="panel-right" class="player-panel">
        <div class="panel-inner">
          <div class="panel-scores">
            <div class="score-item" id="right-score-black">
              <div class="piece black"></div>
              <span class="score-num" id="right-black-count">2</span>
            </div>
            <div class="score-item" id="right-score-white">
              <div class="piece white"></div>
              <span class="score-num" id="right-white-count">2</span>
            </div>
          </div>
          <div class="piece-slot" id="right-slot"></div>
          <!-- Decorative character icons (CSS shows the correct one) -->
          <svg class="panel-icon wand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" aria-hidden="true">
            <rect x="20" y="24" width="155" height="12" rx="5" fill="#E91E8C"/>
            <rect x="28" y="25.5" width="140" height="4" rx="2" fill="rgba(255,255,255,0.38)"/>
            <rect x="28" y="33" width="140" height="2.5" rx="1" fill="rgba(0,0,0,0.18)"/>
            <polygon fill="#E91E8C" points="23,8 24.42,24.69 34,10.95 26.89,26.11 42.05,19 28.31,28.58 45,30 28.31,31.42 42.05,41 26.89,33.89 34,49.05 24.42,35.31 23,52 21.58,35.31 12,49.05 19.11,33.89 3.95,41 17.69,31.42 1,30 17.69,28.58 3.95,19 19.11,26.11 12,10.95 21.58,24.69"/>
            <polygon fill="#880E4F" points="23,22 31,30 23,38 15,30"/>
            <polygon fill="rgba(255,255,255,0.6)" points="15,25 23,22 30,26 23,29"/>
          </svg>
          <svg class="panel-icon broomstick-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" aria-hidden="true">
            <polygon fill="#43A047" stroke="#1B5E20" stroke-width="0.8" stroke-linejoin="round"
              points="82,24 72,18 62,10 55,16 45,6 38,14 28,8 22,16 14,10 8,18 3,28 3,32 8,42 14,50 22,44 28,52 38,46 45,54 55,44 62,50 72,42 82,36"/>
            <g stroke="#1B5E20" stroke-width="1" opacity="0.55" stroke-linecap="round">
              <line x1="82" y1="27" x2="6"  y2="22"/><line x1="82" y1="30" x2="3" y2="30"/>
              <line x1="82" y1="33" x2="6"  y2="38"/><line x1="82" y1="26" x2="30" y2="9"/>
              <line x1="82" y1="34" x2="30" y2="51"/><line x1="82" y1="28" x2="52" y2="8"/>
              <line x1="82" y1="32" x2="52" y2="52"/>
            </g>
            <rect x="80" y="24" width="95" height="12" rx="5" fill="#388E3C"/>
            <rect x="88" y="25.5" width="82" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
            <rect x="88" y="33" width="82" height="2.5" rx="1" fill="rgba(0,0,0,0.18)"/>
          </svg>
          <div class="panel-end">
            <span class="panel-status" id="right-status">Black's turn</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Game over overlay — two halves, one per player -->
    <div id="overlay" class="hidden">
      <div class="modal-half" id="modal-left">
        <p class="winner-text" id="left-winner"></p>
        <div class="modal-scores">
          <div class="modal-score-item">
            <div class="piece black"></div>
            <span id="left-final-black"></span>
          </div>
          <span class="modal-vs">vs</span>
          <div class="modal-score-item">
            <div class="piece white"></div>
            <span id="left-final-white"></span>
          </div>
        </div>
        <div class="modal-btns">
          <button class="btn-play-again">Play Again</button>
          <button class="btn-gloat" disabled>Brag</button>
        </div>
      </div>

      <div class="modal-half" id="modal-right">
        <p class="winner-text" id="right-winner"></p>
        <div class="modal-scores">
          <div class="modal-score-item">
            <div class="piece black"></div>
            <span id="right-final-black"></span>
          </div>
          <span class="modal-vs">vs</span>
          <div class="modal-score-item">
            <div class="piece white"></div>
            <span id="right-final-white"></span>
          </div>
        </div>
        <div class="modal-btns">
          <button class="btn-play-again">Play Again</button>
          <button class="btn-gloat" disabled>Brag</button>
        </div>
      </div>
    </div>

    <!-- Startup overlay — shown before first game, hidden after Play -->
    <div id="start-overlay">

      <div class="start-modal" id="start-modal-left">
        <p class="start-game-title">Wicked</p>
        <p class="start-char-name">Elphaba</p>
        <div class="username-btns">
          <button class="btn-username" data-name="NORA">NORA</button>
          <button class="btn-username" data-name="LILY">LILY</button>
          <button class="btn-username" data-name="GRANDPA">GRANDPA</button>
          <button class="btn-username" data-name="GRANDMA">GRANDMA</button>
          <button class="btn-username" data-name="DANIEL">DANIEL</button>
          <button class="btn-username" data-name="LAUREN">LAUREN</button>
          <button class="btn-username" data-name="DAVID">DAVID</button>
          <button class="btn-username btn-username-computer" data-name="COMPUTER">COMPUTER</button>
        </div>
        <button class="btn-continue" disabled>Play</button>
      </div>

      <!-- Randomize button — centered between the two modals -->
      <button id="randomize-btn" aria-label="Randomize characters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>

      <!-- Orbit tokens — shown only during randomize animation -->
      <div id="token-elphaba" class="char-token">E</div>
      <div id="token-glinda"  class="char-token">G</div>

      <div class="start-modal" id="start-modal-right">
        <p class="start-game-title">Wicked</p>
        <p class="start-char-name">Glinda</p>
        <div class="username-btns">
          <button class="btn-username" data-name="NORA">NORA</button>
          <button class="btn-username" data-name="LILY">LILY</button>
          <button class="btn-username" data-name="GRANDPA">GRANDPA</button>
          <button class="btn-username" data-name="GRANDMA">GRANDMA</button>
          <button class="btn-username" data-name="DANIEL">DANIEL</button>
          <button class="btn-username" data-name="LAUREN">LAUREN</button>
          <button class="btn-username" data-name="DAVID">DAVID</button>
          <button class="btn-username btn-username-computer" data-name="COMPUTER">COMPUTER</button>
        </div>
        <button class="btn-continue" disabled>Play</button>
      </div>

    </div>

    <!-- Floating piece that follows the pointer during drag -->
    <div id="floating-piece" class="piece hidden"></div>

    <!-- Pause menu — shown on double-click of the board -->
    <div id="quit-overlay" class="hidden">
      <div class="quit-modal">
        <p class="quit-text"></p>

        <div class="quit-checkbox-row">
          <label class="quit-checkbox-label" for="chk-piece-animations">
            <input type="checkbox" id="chk-piece-animations" checked>
            Piece Animations
          </label>
        </div>

        <div class="quit-volume-row">
          <button id="btn-music" class="audio-btn" title="Toggle music" aria-label="Toggle music">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
              <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <input type="range" id="music-slider" class="volume-slider" min="0" max="100" value="75">
        </div>

        <div class="quit-volume-row">
          <button id="btn-sfx" class="audio-btn" title="Toggle sound effects" aria-label="Toggle sound effects">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <input type="range" id="sfx-slider" class="volume-slider" min="0" max="100" value="22">
        </div>

        <div class="quit-preview">
          <button class="btn-preview btn-music-a">Music A</button>
          <button class="btn-preview btn-music-b">Music B</button>
          <button class="btn-preview btn-music-c">Music C</button>
        </div>

        <div class="quit-actions">
          <button class="btn-start-over">Start Over</button>
          <button class="btn-exit">Exit</button>
        </div>
      </div>
    </div>
